name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/finance_planner"
  DATABASE_URL_UNPOOLED: "postgresql://postgres:postgres@localhost:5432/finance_planner"
  BETTER_AUTH_SECRET: "ci-dummy-secret-key-at-least-32-chars-long"
  BETTER_AUTH_URL: "http://localhost:3000"
  GITHUB_CLIENT_ID: "dummy-client-id"
  GITHUB_CLIENT_SECRET: "dummy-client-secret"

jobs:
  check:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & Component Tests
        run: npx vitest run

      - name: Build production
        run: npm run build